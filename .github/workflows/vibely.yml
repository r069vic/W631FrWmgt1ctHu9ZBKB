name: vibely
# 該站每天台北 09:00 更新;排在 09:20(UTC 01:20),GitHub 通常會再晚 30~60 分鐘
on:
  schedule:
    - cron: '20 1 * * *'
  workflow_dispatch:
  push:
    branches: [vibely-probe]
permissions:
  contents: write
concurrency:
  group: scan-data
  cancel-in-progress: false
jobs:
  vibely:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node probe3.mjs
      - name: commit data
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add data/vibely
          git diff --cached --quiet || git commit -m "vibely data $(date -u +%F)"
          git pull --rebase -q || true
          git push
