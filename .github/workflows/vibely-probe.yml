name: vibely-probe
on:
  push:
    branches: [vibely-probe]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i playwright@1.49.1 && npx playwright install --with-deps chromium
      - run: node probe/vibely2.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: vibely, path: results }
