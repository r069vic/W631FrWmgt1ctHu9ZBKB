name: lcc-test
# One-off: send the new calendar summary to Telegram for the alerts stored since 2026-11-08 (format check).
on:
  push:
    branches: [lcc-test]
    paths: [.github/workflows/lcc-test.yml]
jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      OUTSTATION_URL: ${{ secrets.OUTSTATION_URL }}
      OUTSTATION_TOKEN: ${{ secrets.OUTSTATION_TOKEN }}
    steps:
      - run: |
          base="${OUTSTATION_URL%/out/ingest}/cal"
          curl -sS --fail-with-body -X POST "$base/notify" -H "Authorization: Bearer $OUTSTATION_TOKEN" -H "content-type: application/json" -d '{"since":"2026-11-08T00:00:00.000Z"}'
