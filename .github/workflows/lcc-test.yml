name: lcc-test
# One-off debug: why low-cost round trips (lrt) come back empty. Runs on pushes to lcc-test only; uploads nothing.
on:
  push:
    branches: [lcc-test]
    paths: [.github/workflows/lcc-test.yml]
permissions:
  contents: write
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save puppeteer-core
      - run: mkdir -p results && node scan_cal.mjs --kinds lrt --airports OIT,YGJ,KCZ --out results/cal-0.json 2>&1 | tee results/debug.log
        env:
          CHROME_PATH: /usr/bin/google-chrome
          CAL_DEBUG: '1'
      - if: always()
        run: |
          git fetch -q origin lcc-test && git checkout -q -B lcc-test origin/lcc-test
          mkdir -p test-out && rm -f test-out/dbg-* && cp results/debug.log test-out/lcc-debug.log && cp results/dbg-*.png test-out/ 2>/dev/null || true
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add -f test-out; git commit -m "lcc debug output" || echo none
          git push origin HEAD:lcc-test
