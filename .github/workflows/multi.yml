name: multi
# Multi-city X>TPE ... TPE>Y for every pair, nonstop only, from LINE Travel's JSON API (scan_line.mjs).
# 22 hourly batches, one departure airport each (batch = UTC hour 0-21 = index in scan_line.mjs ALL):
# Taipei 08:17 HND, 09:17 NRT, 10:17 NGO, 11:17 KIX, 12:17 FUK, 13:17 CTS, 14:17 TAK, 15:17 KMJ, 16:17 OKA, 17:17 OKJ, 18:17 HKG,
# 19:17 BKK, 20:17 DMK, 21:17 KUL, 22:17 SIN, 23:17 SGN, 00:17 HAN, 01:17 DAD, 02:17 ICN, 03:17 GMP, 04:17 PUS, 05:17 BWN.
# Each pair once a day, all months. One batch = about 20 pairs x 13 date groups.
# LINE finds no nonstop itinerary -> the pair has no row (nothing is guessed from Google).
on:
  schedule:
    - cron: '17 0-21 * * *'
  workflow_dispatch:
    inputs:
      batch:
        description: batch 0-21 (departure airport), empty = the current UTC hour
        default: ''
permissions:
  contents: read
  actions: write
concurrency:
  group: multi
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      batch: ${{ steps.p.outputs.batch }}
    steps:
      - id: p
        run: |
          b="${{ inputs.batch }}"; [ -z "$b" ] && b=$(date -u +%-H)
          echo "batch=$b" >> "$GITHUB_OUTPUT"; echo "batch $b"
  scan:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # waits 60 s after starting the searches, then asks again every 60 s (at most 5 times) until LINE reports them complete
      - run: node scan_line.mjs --batch ${{ needs.plan.outputs.batch }} --batches 22 --shard ${{ matrix.shard }} --shards 4 --out results/shard-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shard-${{ matrix.shard }}
          path: results/
  merge:
    needs: scan
    if: always() && needs.scan.result != 'skipped'
    runs-on: ubuntu-latest
    env:
      OUTSTATION_URL: ${{ secrets.OUTSTATION_URL }}
      OUTSTATION_TOKEN: ${{ secrets.OUTSTATION_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: art
      - run: node merge.mjs art
      - name: Upload to travel-detector
        run: |
          curl -sS --fail-with-body -X POST "$OUTSTATION_URL" -H "Authorization: Bearer $OUTSTATION_TOKEN" -H "content-type: application/json" --data-binary @out/payload.json > resp.json
          cat resp.json
          keys=$(node -e "const r=require('./resp.json');process.stdout.write((r.fine||[]).join(','))")
          if [ -n "$keys" ]; then gh workflow run scan.yml --repo "$GITHUB_REPOSITORY" -f mode=fine -f airports="$keys" || echo "scan.yml disabled, fine scan skipped"; fi
