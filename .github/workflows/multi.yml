name: multi
# Multi-city X>TPE ... TPE>Y for every pair, nonstop only, from LINE Travel's JSON API (scan_line.mjs).
# 24 hourly batches (batch = UTC hour); each pair once a day, all months. One batch = about 19 pairs x 13 date groups.
# LINE finds no nonstop itinerary -> the pair has no row (nothing is guessed from Google).
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      batch:
        description: batch 0-23, empty = the current UTC hour
        default: ''
permissions:
  contents: read
  actions: write
concurrency:
  group: multi
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      batch: ${{ steps.p.outputs.batch }}
    steps:
      - id: p
        run: |
          b="${{ inputs.batch }}"; [ -z "$b" ] && b=$(date -u +%-H)
          echo "batch=$b" >> "$GITHUB_OUTPUT"; echo "batch $b"
  scan:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # waits 60 s after starting the searches, then asks again every 60 s (at most 5 times) until LINE reports them complete
      - run: node scan_line.mjs --batch ${{ needs.plan.outputs.batch }} --batches 24 --shard ${{ matrix.shard }} --shards 4 --out results/shard-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shard-${{ matrix.shard }}
          path: results/
  merge:
    needs: scan
    if: always() && needs.scan.result != 'skipped'
    runs-on: ubuntu-latest
    env:
      OUTSTATION_URL: ${{ secrets.OUTSTATION_URL }}
      OUTSTATION_TOKEN: ${{ secrets.OUTSTATION_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: art
      - run: node merge.mjs art
      - name: Upload to travel-detector
        run: |
          curl -sS --fail-with-body -X POST "$OUTSTATION_URL" -H "Authorization: Bearer $OUTSTATION_TOKEN" -H "content-type: application/json" --data-binary @out/payload.json > resp.json
          cat resp.json
          keys=$(node -e "const r=require('./resp.json');process.stdout.write((r.fine||[]).join(','))")
          if [ -n "$keys" ]; then gh workflow run scan.yml --repo "$GITHUB_REPOSITORY" -f mode=fine -f airports="$keys"; fi
