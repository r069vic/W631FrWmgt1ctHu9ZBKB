name: cloud-test
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save puppeteer-core
      - run: node cloud_test.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome
