name: bwn-test
# One-off probe: how does Google Flights encode "nonstop only"? Pushes to line-scan-test touching this file, or by hand.
on:
  push:
    branches: [line-scan-test]
    paths:
      - .github/workflows/bwn-test.yml
      - probe_stops.mjs
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bwn-test
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save puppeteer-core
      - run: node probe_stops.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - if: always()
        run: |
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add -f test-out/probe-stops.json; git commit -m "probe-stops output" || echo none
          for i in 1 2 3; do git pull --rebase -q origin line-scan-test && git push origin HEAD:line-scan-test && break; sleep 5; done
